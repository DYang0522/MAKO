name: Tests

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trace-producer:
    name: Trace producer contract (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up portable Python runtime
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - name: Reject protected licensed inputs and binary payloads
        run: ./scripts/test-protected-inputs.sh
      - name: Keep private branches off public remotes
        run: ./scripts/test-private-push-guard.sh
      - name: Check contributor identity handling
        run: python3 scripts/test-update-contributors.py
      - name: Exercise safe capture staging and sanitization
        run: ./scripts/test-capture-trace.sh
      - name: Check local release-candidate verification
        if: runner.os == 'Linux'
        run: ./scripts/test-release-candidate.sh
  decky:
    name: MAKO Decky
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.17.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: plugin/pnpm-lock.yaml

      - name: Set up Decky Python runtime
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install locked frontend dependencies
        working-directory: plugin
        run: pnpm install --frozen-lockfile

      - name: Check Markdown formatting
        working-directory: plugin
        run: pnpm run format:markdown:check

      - name: Install Flatpak test dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends flatpak
          flatpak --version

      - name: Test backend behavior
        working-directory: plugin
        run: pnpm run test:backend

      - name: Type-check frontend tests
        working-directory: plugin
        run: pnpm run test:frontend:typecheck

      - name: Test frontend behavior with coverage
        working-directory: plugin
        run: pnpm run test:frontend:coverage

      - name: Build release-candidate frontend
        working-directory: plugin
        env:
          MAKO_LOCAL_RELEASE_BUILD: "1"
        run: pnpm run build

      - name: Retain frontend coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: decky-frontend-coverage
          path: plugin/coverage/frontend
          if-no-files-found: ignore
          retention-days: 14

  renderer:
    name: MAKO Renderer (${{ matrix.toolchain }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - toolchain: gcc
            cc: gcc
            cxx: g++
          - toolchain: clang
            cc: clang
            cxx: clang++
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install Renderer build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build g++ clang \
            libvulkan-dev libx11-dev libxcb1-dev \
            qt6-base-dev qt6-declarative-dev \
            qml6-module-qtqml qml6-module-qtqml-models qml6-module-qtqml-workerscript \
            qml6-module-qtquick qml6-module-qtquick-controls qml6-module-qtquick-layouts \
            qml6-module-qtquick-templates qml6-module-qtquick-window

      - name: Fetch the native package Vulkan headers
        run: |
          revision="$(cat engine/vulkan-headers-revision.txt)"
          git clone --depth=1 --branch "$revision" \
            https://github.com/KhronosGroup/Vulkan-Headers "$RUNNER_TEMP/mako-vulkan-headers"
          echo "CXXFLAGS=-I$RUNNER_TEMP/mako-vulkan-headers/include" >> "$GITHUB_ENV"

      - name: Configure Renderer tests
        run: >-
          cmake -S engine -B engine/build/ci-${{ matrix.toolchain }} -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=ON
          -DMAKO_BUILD_VK_LAYER=ON
          -DMAKO_BUILD_UI=ON
          -DMAKO_BUILD_CLI=ON
          -DMAKO_REQUIRE_NATIVE_PACKAGE_HEADERS=ON
          -DMAKO_GPU_QUALITY_TEST=OFF

      - name: Build Renderer and test executables
        run: cmake --build engine/build/ci-${{ matrix.toolchain }}

      - name: Run Renderer tests
        run: ctest --test-dir engine/build/ci-${{ matrix.toolchain }} --output-on-failure

      - name: Package patched x86_64 Renderer libraries
        if: matrix.toolchain == 'clang'
        run: |
          set -euo pipefail
          package_dir="$RUNNER_TEMP/mako-renderer-patch"
          mkdir -p "$package_dir/lib"

          install -Dm755 engine/build/ci-clang/mako-render/libmako-render.so \
            "$package_dir/lib/libmako-render.so"
          install -Dm755 engine/build/ci-clang/mako-render/libmako-render-scaling.so \
            "$package_dir/lib/libmako-render-scaling.so"

          cat > "$package_dir/INSTALL.txt" <<'EOF'
          MAKO Renderer patch build (x86_64)
          ==================================

          This archive contains the two 64-bit Renderer shared libraries built
          from the MAKO fork branch. It is a patch for an existing MAKO Renderer
          installation, not a complete standalone MAKO distribution.

          Close all games before replacing either library. Locate the installed
          files with:

            find "$HOME/.local" -type f \\
              \\( -name libmako-render.so -o -name libmako-render-scaling.so \\) -print

          Back up the existing libraries, then copy the matching files from this
          archive's lib/ directory into the same installed lib/ directory.
          Do not copy these files into the source checkout's engine/build tree.

          Keep the backups so the previous Renderer can be restored. This build
          contains x86_64 libraries only; it does not replace 32-bit layers or
          package MAKO Decky.
          EOF

          git rev-parse HEAD > "$package_dir/SOURCE-COMMIT.txt"
          (
            cd "$package_dir"
            sha256sum lib/*.so > SHA256SUMS
          )
          tar -C "$package_dir" -cJf \
            "$RUNNER_TEMP/MAKO-Renderer-patch-x86_64.tar.xz" .

      - name: Upload patched x86_64 Renderer
        if: matrix.toolchain == 'clang'
        uses: actions/upload-artifact@v7
        with:
          name: MAKO-Renderer-patch-x86_64
          path: ${{ runner.temp }}/MAKO-Renderer-patch-x86_64.tar.xz
          if-no-files-found: error
          retention-days: 14

  renderer-sanitizers:
    name: MAKO Renderer (ASan + UBSan)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CC: gcc
      CXX: g++
      MAKO_ENABLE_SANITIZERS: ON
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Confirm hosted sanitizer toolchain
        run: |
          for command in cmake ctest gcc g++; do
            command -v "$command" >/dev/null || {
              echo "Required hosted-runner command is missing: $command" >&2
              exit 1
            }
          done

      - name: Install sanitizer build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan-dev libx11-dev libxcb1-dev

      - name: Fetch the shared Vulkan headers
        run: |
          revision="$(cat engine/vulkan-headers-revision.txt)"
          git clone --depth=1 --branch "$revision" \
            https://github.com/KhronosGroup/Vulkan-Headers "$RUNNER_TEMP/mako-vulkan-headers"
          echo "CXXFLAGS=-I$RUNNER_TEMP/mako-vulkan-headers/include" >> "$GITHUB_ENV"

      - name: Run sanitized portable policy tests
        working-directory: engine
        run: ./scripts/test-adaptive-scheduler.sh
